[package]
license-files = [
  "LICENSE-APACHE",
  "LICENSE-MIT",
]

[[package.extra-sources]]
number = 2
file = "https://raw.githubusercontent.com/knurling-rs/defmt/refs/tags/%{crate}-v%{version}/LICENSE-APACHE"
comments = [
  "include license file",
  "TODO https://github.com/knurling-rs/defmt/pull/XX",
]

[[package.extra-sources]]
number = 3
file = "https://raw.githubusercontent.com/knurling-rs/defmt/refs/tags/%{crate}-v%{version}/LICENSE-MIT"
comments = [
  "include license file",
  "TODO https://github.com/knurling-rs/defmt/pull/XX",
]

[scripts]
prep.post = ["""\
# copy in license file
cp -p %{SOURCE2} .
cp -p %{SOURCE3} ."""]

[features]
# enable "unable-test" feature because unit tests requires.
enable = [ "unstable-test" ]
